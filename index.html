            <input type="text" id="model" placeholder="Model">

                <input onkeyup="gettotal()" type="number"  id="taxes"  placeholder="taxes">

            </div>
            <input type="number" id="count" placeholder="Enter Your Count">
            <input type="text" id="category" placeholder="Category">
            <button id="sumbit">Creat</button>
        </div>
        <div class="outputs">

            <div class="search">
                <input onkeyup=" SearchDate(this.value)" type="text" placeholder="Search" id="search">
            </div>
            <div class="btn-search">
            <button onclick=" getsearchmode(this.id)" id="SearchModel">Search By Model </button>
            <button  onclick=" getsearchmode(this.id)" id="SearchCategory">Search By Category</button>
        </div>
<div id="deleteall"></div>

 <tr>
